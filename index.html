<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Usuarios</title>
    <!-- Enlace a Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KyZXEJ6vM2yQb7oh4r7rcSHCx8g5f9EZtrpO2SHYGe2NzJhM0h4d8I54p7tQd8gh" crossorigin="anonymous">
</head>
<body style="background-color: #f4f4f9;">
    <div class="container mt-5">
        <h1 class="text-center mb-4 text-primary">Usuarios</h1>
    
        <div id="usuarios" class="row">
            <!-- Aquí se mostrarán los datos de los usuarios -->
        </div>
    </div>

    <script src="datos.js"></script>
    <script src="datos1.js"></script>

    <script>
        // Mostrar los datos de los usuarios en la página
        const usuarios = [usuario, usuario1];
    
        const usuariosDiv = document.getElementById('usuarios');
    
        usuarios.forEach(usuario => {
            const userDiv = document.createElement('div');
            userDiv.classList.add('col-md-4', 'mb-4'); // Bootstrap: 3 columnas, margen inferior
            userDiv.innerHTML = `
                <div class="card shadow-sm" style="border-radius: 15px; background-color: #ffffff;">
                    <div class="card-body">
                        <h5 class="card-title text-center text-success">${usuario.nombre} ${usuario.apellido}</h5>
                        <p><strong>ID:</strong> ${usuario.id}</p>
                        <p><strong>Carrera:</strong> ${usuario.carrera}</p>
                        <p><strong>Semestre:</strong> ${usuario.semestre}</p>
                        <p><strong>Edad:</strong> ${usuario.edad}</p>
                        <p><strong>Email:</strong> ${usuario.email}</p>
                        <p><strong>Teléfono:</strong> ${usuario.telefono}</p>
                        <p><strong>DNI:</strong> ${usuario.dni}</p>
                    </div>
                </div>
            `;
            usuariosDiv.appendChild(userDiv);
        });
    </script>

    <!-- Enlace a los scripts de Bootstrap (JS) -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js" integrity="sha384-oBqDVmMz4fnFO9gybK7ZlKQKpD6dq5rSS9o/PoD8yV4u0zfe0mN7bXSjiR6vJwJm" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js" integrity="sha384-pzjw8f+ua7Kw1TIq0pDkF6g63kW66P+V7ibIs3bXJw2GTxXzHdp6Vd0P4iCE9qJY" crossorigin="anonymous"></script>
</body>
</html>
